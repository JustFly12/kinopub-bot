services:
  bot:
    build:
      context: .
    image: kinopub-bot:local
    init: true
    ipc: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PLAYWRIGHT_HEADLESS: "true"
    volumes:
      - ./data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
